# Grafana datasource provisioning — auto-adds the Prometheus datasource on first start,
# so imported dashboards (e.g. the reth dashboard, Grafana.com ID 20638) resolve immediately.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
