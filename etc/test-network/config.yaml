# Network configuration: the devnet and local networks, each a 1:1 mirror of
# the schedule baked into the binary for that network (see
# crates/execution/evm/src/chainspec.rs: RaylsHardFork::{devnet,local}).
#
# Use in place of the baked-in `--network` profile:
#   rayls-network node --config-file examples/client.yaml --subnet <name>
#
# testnet and mainnet have no entry here: a config-file subnet may not
# declare a baked-in network's chain-id (testnet 7295799, mainnet 72957), so
# those networks are started with `--network testnet|mainnet` instead.
#
# At boot the datadir's genesis chain-id is checked against the subnet's
# `chain_id`; a mismatch (wrong datadir for this subnet) refuses to start.
#
# Fork values are activation block numbers, or `never`.

networks:
  devnet:
    chain_id: 503
    hardforks:
      Eip1559: 50
      BatchDigestV2: 100
      AdminTransfer: never
      PrecompileGasFix: 150
      RlsStorage: never
      Tokenomics: never
      Uups: never
      Erc20PrecompileBytecode: 1542796
      TransactionLoadBalancing: 1542796
      UsdrSupplyCorrection: never
      EmptyOutputBlock: 0
      DynamicCommitteeSizing: never
      HybridRewards: never
      OutputSeqNormalization: never
      SenderAffinityLoadBalancing: never
  local:
    chain_id: 487
    hardforks:
      Eip1559: 0
      BatchDigestV2: 0
      AdminTransfer: 0
      PrecompileGasFix: 0
      RlsStorage: never
      Tokenomics: never
      Uups: never
      Erc20PrecompileBytecode: 1
      TransactionLoadBalancing: 0
      UsdrSupplyCorrection: 100
      EmptyOutputBlock: 0
      DynamicCommitteeSizing: 0
      HybridRewards: 1
      OutputSeqNormalization: 0
      SenderAffinityLoadBalancing: 0
