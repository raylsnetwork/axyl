[package]
name = "rayls-infrastructure-storage"
version.workspace = true
edition = "2021"
license = "BUSL-1.1"
authors = [
]
publish = false

[dependencies]
rayls-infrastructure-utils.workspace = true
tracing.workspace = true
rayls-infrastructure-types = { workspace = true }
eyre = { workspace = true }
prometheus = { workspace = true }
ouroboros = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
# For the persist async implemetation.
tokio = { workspace = true, features = [ "sync" ] }

# redb backend
redb = { version = "2.1.1", optional = false }

# mdbx backend- default
reth-libmdbx = { workspace = true, optional = true, features = [
    "return-borrowed",
    "read-tx-timeouts",
] }
page_size = { version = "0.6.0", optional = true }

# consensus cold-storage: reused as the immutable nippy-jar file format only (not reth StaticFile*)
reth-nippy-jar = { workspace = true, optional = true }
lru = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
criterion = { workspace = true }

[[bench]]
name = "cold_read_path"
harness = false
required-features = ["cold-storage"]

[features]
redb = []
reth-libmdbx = ["dep:reth-libmdbx", "dep:page_size"]
# Consensus DB cold tier (append-only nippy-jar archive). On by default; disable to compile out all
# cold-storage code and ship the hot-only mdbx stack.
cold-storage = ["dep:reth-nippy-jar", "dep:thiserror", "dep:serde", "dep:lru"]
default = ["reth-libmdbx", "cold-storage"]
archive-replay = []

[lints]
workspace = true
