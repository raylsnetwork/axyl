# =============================================================================
# Claude Code Review
# =============================================================================
# Uses pull_request_target (not pull_request) so the job runs in the BASE repo
# context and can access secrets on PRs from forks. Because that grants secrets
# to a job that checks out untrusted fork code, the job is gated to same-repo
# PRs or fork PRs from trusted authors, skips every Dependabot PR, and Claude
# is restricted to read-only tools plus posting PR comments.
# =============================================================================

name: Claude Code Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    name: 🤖 Claude Code Review
    # Only auto-review same-repo PRs, or fork PRs from trusted authors (org
    # members / collaborators). Everyone else uses the @claude mention flow.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # pull_request_target checks out the base by default; the `if:` gate
          # above restricts this to trusted authors' PRs.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history so `git diff` can find the merge base with the PR's
          # base branch (Claude can't `git fetch` at runtime).
          fetch-depth: 0
          # Don't leave GITHUB_TOKEN in .git/config, where the Read tool could
          # reach it (e.g. via prompt injection in the PR) and leak it in a comment.
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@fbda2eb1bdc90d319b8d853f5deb53bca199a7c1 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's GITHUB_TOKEN directly instead of the Claude
          # GitHub App: the OIDC->app-token exchange 401s unless the app is
          # installed on the org. The job grants pull-requests: write, so this
          # token can post review comments (as github-actions[bot]).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Don't print Claude's full transcript (may contain code/secrets) to
          # public Actions logs, and don't create a progress-tracking comment.
          show_full_output: false
          track_progress: false
          exclude_comments_by_actor: 'github-actions[bot]'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and Rust best practices
            - Solidity contract correctness and security
            - Concurrency and unsafe code
            - Potential bugs or issues
            - Security implications
            - Performance considerations
            - Error handling patterns

            Note: The PR branch is already checked out in the current working directory.
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            Use `gh pr view` for the PR title/description and `gh pr diff` to see the changes.
            For large PRs or more context, use `git diff ${{ github.event.pull_request.base.sha }}...HEAD`.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          # Restricted per security review: read PR metadata and the diff, post
          # comments, and read files. No arbitrary gh api / git / shell access.
          claude_args: '--model claude-opus-5-5 --effort high  --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(gh pr comment:*),Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment"'
