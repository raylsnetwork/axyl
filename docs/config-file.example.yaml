# Template for a new client's network configuration file.
#
# Copy to <client>.yaml, fill in one entry per subnet this client operates.
# The number of subnets is not fixed - each client defines its own.
#
# Start a node from it with:
#
#   rayls node --config-file <client>.yaml --subnet <subnet-name>
#
# The file only externalizes the chain-id and hardfork schedule of the
# selected subnet - that is the part that used to be baked into the binary.
# Everything else (EVM genesis, consensus parameters, committee, node
# identity) still comes from the node's datadir, exactly as without this file.
#
# At boot the datadir's genesis chain-id is checked against the subnet's
# `chain_id` and the node refuses to start on a mismatch (wrong datadir for
# this subnet).
#
# The datadir also keeps a `schedule-record.yaml` pinning the hardfork
# schedule its executed blocks ran under (including forks pinned to `never`,
# so only a record written before a fork existed lacks it). At boot the
# selected schedule is verified against that record: a fork that has ALREADY
# activated (boundary at or below the current head) cannot be moved, removed,
# or back-dated - the node refuses to start, because that schedule would
# re-interpret the chain's history. The refusal names the record and its
# remedy: add or fix the fork's entry in the record, or delete the record to
# re-record the selected schedule (the check then starts from the current
# head). A boundary still in the future MAY be changed - that is how agreed
# schedule updates ship - and the node warns about the change and re-records
# the new schedule. A datadir without a record (a fresh chain, or one created
# before this feature) is trusted as-is and starts recording from that boot.

networks:
  <subnet-name>:
    # Chain-id of this subnet's datadir (verified against the datadir's
    # genesis at boot). Mainnet is 72957; testnet 7295799, devnet 503, local 487.
    # A subnet may NOT declare the mainnet (72957) or testnet (7295799)
    # chain-id: those networks always run on their baked-in schedule and are
    # started with `--network <name>`; a subnet declaring one of those
    # chain-ids is refused at boot.
    chain_id: <chain-id>
    # Hardfork schedule: Rayls hardfork name -> activation block, or `never`.
    # Every known fork must be defined: a fork missing from this map refuses
    # the boot (a binary upgrade that adds a fork must not leave it silently
    # `never` here while the network activates it). Names (case-insensitive):
    # Eip1559, BatchDigestV2, AdminTransfer, PrecompileGasFix, RlsStorage,
    # Tokenomics, Uups, Erc20PrecompileBytecode, TransactionLoadBalancing,
    # UsdrSupplyCorrection, EmptyOutputBlock, DynamicCommitteeSizing,
    # HybridRewards, OutputSeqNormalization, SenderAffinityLoadBalancing.
    hardforks:
      Eip1559: 0
      BatchDigestV2: 0
      AdminTransfer: never
      PrecompileGasFix: 0
      RlsStorage: never
      Tokenomics: never
      Uups: never
      Erc20PrecompileBytecode: never
      TransactionLoadBalancing: never
      UsdrSupplyCorrection: never
      EmptyOutputBlock: never
      DynamicCommitteeSizing: never
      HybridRewards: never
      OutputSeqNormalization: never
      SenderAffinityLoadBalancing: never
